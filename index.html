
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actor Characteristics Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #100c20, #201333, #111827);
            color: white;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }

        header h1 {
            font-size: clamp(28px, 5vw, 44px);
            color: #ffd166;
            margin-bottom: 12px;
        }

        header p {
            color: #d1d5db;
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin: 20px auto 30px;
            max-width: 650px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 15px;
            border: 2px solid #51416b;
            border-radius: 10px;
            background: #211a32;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ffd166;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            background: #ffd166;
            color: #201333;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ffb703;
            transform: translateY(-2px);
        }

        .message {
            text-align: center;
            margin: 15px 0;
            color: #ffd166;
            min-height: 22px;
        }

        .actor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .actor-card {
            background: rgba(39, 30, 57, 0.95);
            border: 1px solid #49385f;
            border-radius: 16px;
            padding: 24px;
            transition: 0.25s;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .actor-card:hover {
            transform: translateY(-5px);
            border-color: #ffd166;
        }

        .actor-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .actor-card h2 {
            color: #ffd166;
            font-size: 21px;
            margin-bottom: 15px;
        }

        .actor-card ul {
            list-style: none;
            margin-bottom: 20px;
        }

        .actor-card li {
            color: #e5e7eb;
            line-height: 1.5;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .actor-card li::before {
            content: "✦ ";
            color: #ffd166;
        }

        .details-btn {
            width: 100%;
            padding: 11px;
            background: #493568;
            color: white;
        }

        .details-btn:hover {
            background: #654a8d;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid #49385f;
            color: #aaa;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            .actor-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

        <p class="message" id="message" aria-live="polite">
            Explore your favorite Bollywood and Hollywood stars!

                    "Natural screen presence",
                    "Known for heroic roles",

                    "Famous for Steve Rogers / Captain America"
                ]
            }
        ];

        const grid = document.getElementById("actorGrid");
        const input = document.getElementById("actorInput");
        const message = document.getElementById("message");

        function renderActors(list) {
            grid.innerHTML = "";

            if (list.length === 0) {
                message.textContent =
                    "❌ Actor not found! Try another name.";
                return;
            }

            list.forEach(actor => {
                const card = document.createElement("article");
                card.className = "actor-card";

                const icon = document.createElement("div");
                icon.className = "actor-icon";
                icon.textContent = actor.icon;

                const title = document.createElement("h2");
                title.textContent = actor.name;

                const listElement = document.createElement("ul");
                listElement.className = "hidden";

                actor.characteristics.forEach(characteristic => {
                    const item = document.createElement("li");
                    item.textContent = characteristic;
                    listElement.appendChild(item);
                });

                const button = document.createElement("button");
                button.className = "details-btn";
                button.textContent = "View Characteristics";

                button.addEventListener("click", () => {
                    const isHidden = listElement.classList.toggle("hidden");
                    button.textContent = isHidden
                        ? "View Characteristics"
                        : "Hide Characteristics";
                });

                card.append(icon, title, listElement, button);
                grid.appendChild(card);
            });

            message.textContent =
                `🎭 Found ${list.length} actor${list.length === 1 ? "" : "s"}!`;
        }

        function searchActor() {
            const query = input.value.trim().toLowerCase();

            if (!query) {
                message.textContent = "Please enter an actor's name.";
                input.focus();
                return;
            }

            const results = actors.filter(actor =>
                actor.name.toLowerCase().includes(query)
            );

            renderActors(results);
        }

        function showAllActors() {
            input.value = "";
            renderActors(actors);
        }

        input.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                searchActor();
            }
        });

        renderActors(actors);
